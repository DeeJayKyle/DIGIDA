name: release

# A release is built into a draft and published only once every file is on it, since the
# repository keeps releases immutable: a published release takes no further uploads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version to release, such as v1.0.0. Left empty, the run only builds.
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  # the tag to release, from a pushed tag or the manual run's input, empty for a plain build
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  windows:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64compatible
            setup: DIGIDA-Setup
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            arch: arm64
            setup: DIGIDA-Setup-arm64
    steps:
      - uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          version="${TAG:-${GITHUB_SHA:0:7}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: build
        run: cargo build --release --locked --package sonora --target ${{ matrix.target }}

      - name: stage the executable
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/digida.exe" "dist/digida-$VERSION-$TARGET.exe"

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          DIGIDA_ARCH: ${{ matrix.arch }}
          DIGIDA_SETUP: ${{ matrix.setup }}
        run: |
          $number = $env:VERSION.TrimStart("v")
          if ($number -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            $number = "0.0.0"
          }
          $env:DIGIDA_VERSION = $number
          $env:DIGIDA_EXE = (Resolve-Path "target/$env:TARGET/release/digida.exe").Path
          $env:DIGIDA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/digida.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: stage the licenses
        run: |
          set -euo pipefail
          mkdir -p licenses/icons
          cp COPYING licenses/LICENSE
          cp THIRD-PARTY.md licenses/THIRD-PARTY.md
          cp assets/fonts/LICENSE.txt licenses/LICENSE.Inter
          cp assets/icons/LICENSE licenses/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "licenses/icons/LICENSE.$pack"
          done
          tar -czf "dist/digida-$TAG-licenses.tar.gz" -C licenses .

      - name: checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS

      - name: release notes
        run: |
          set -euo pipefail
          # the section of the changelog for this version, or the unreleased one before it is cut
          awk -v tag="${TAG#v}" '
            /^## \[/ { if (found) exit; if (index($0, "[" tag "]") || index($0, "[Unreleased]")) found = 1; next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "DIGIDA $TAG" > notes.md

      - name: draft the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DIGIDA ${{ env.TAG }}
          files: dist/*
          body_path: notes.md
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true

      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
